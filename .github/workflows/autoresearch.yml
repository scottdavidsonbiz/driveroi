name: Autoresearch Email Optimization

on:
  schedule:
    - cron: "0 2,6,10,14,18,22 * * *"  # Every 4 hours
  workflow_dispatch:  # manual trigger

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/autoresearch/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/autoresearch/requirements.txt

      - name: Run orchestrator
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/autoresearch/orchestrator.py

      - name: Commit results
        run: |
          git config user.name "autoresearch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/autoresearch/baseline.md scripts/autoresearch/results.log
          git diff --staged --quiet || git commit -m "autoresearch $(date +%Y-%m-%d-%H): auto-optimize"
          git push
